name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run ruff check strata tests
      - run: uv run pytest --cov=strata --cov-report=term-missing
      - run: uv run strata golden          # fails if any scenario, render or item hash changed
      - run: uv run strata validate        # every template satisfies the world-model invariants
      - run: uv run strata dataset verify && uv run strata dataset verify --split validation
      - run: make smoke
      - run: uv run mypy strata
        continue-on-error: true            # informational until the Optional-narrowing errors are cleared
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
