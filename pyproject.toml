[project]
name = "strata-bench"
version = "0.2.0"
description = "STRATA: evaluation harness for organizational context engines (authority, time, attribution)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
llm = ["openai>=1.30", "anthropic>=0.40"]
stats = ["statsmodels>=0.14", "pandas>=2"]
dev = ["pytest>=8", "pytest-cov", "hypothesis", "ruff", "mypy", "types-PyYAML", "statsmodels>=0.14", "pandas>=2"]

[project.scripts]
strata = "strata.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["strata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E701", "E702", "E731", "E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
